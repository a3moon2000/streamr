<!DOCTYPE html>
<html>
<head><title>One-at-a-time player test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{margin:0;background:#111;color:#fff;font-family:sans-serif;-webkit-text-size-adjust:100%}
 .bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
 button{flex:1 1 40%;min-height:52px;font-size:15px;font-weight:700;border:none;border-radius:10px;background:#2a2a2a;color:#fff}
 button.on{background:#e50914}
 .lbl{padding:4px 12px 8px;font-size:13px;color:#9a9a9a}
 #slot{width:96vw;height:50vh;border:2px solid #555;display:block;margin:0 auto;background:#000}
 .timer{padding:0 12px 10px;font-size:13px;color:#46d369}
</style>
</head>
<body>
<div class="bar">
 <button onclick="load(this,'VidLux','https://vidlux.online/embed/movie/27205')">VidLux</button>
 <button onclick="load(this,'CineSrc','https://cinesrc.st/embed/movie/27205')">CineSrc</button>
 <button onclick="load(this,'RiveStream','https://rivestream.cc/embed?type=movie&id=27205')">RiveStream</button>
 <button onclick="load(this,'AnyEmbed','https://anyembed.xyz/movie/27205')">AnyEmbed</button>
 <button onclick="load(this,'VidSrc.su','https://vidsrc.su/embed/movie/27205')">VidSrc.su</button>
 <button onclick="load(this,'MadPlay','https://madplay.site/embed/movie/27205')">MadPlay</button>
</div>
<div class="lbl" id="lbl">Tap one player. It loads alone (no bandwidth competition). Note: speed, plays/blocked, ads.</div>
<div class="timer" id="timer"></div>
<iframe id="slot" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; encrypted-media"></iframe>
<script>
 var t0=0;
 function load(btn,name,url){
   document.querySelectorAll('button').forEach(function(b){b.classList.remove('on');});
   btn.classList.add('on');
   document.getElementById('lbl').textContent = name + ' — loading… (sandboxed / popup-blocked)';
   document.getElementById('timer').textContent='';
   var slot=document.getElementById('slot');
   t0=Date.now();
   slot.onload=function(){ document.getElementById('timer').textContent = name+' frame loaded in '+((Date.now()-t0)/1000).toFixed(1)+'s (video may still buffer)'; };
   slot.src='about:blank';
   setTimeout(function(){ slot.src=url; }, 120);
 }
</script>
</body>
</html>
